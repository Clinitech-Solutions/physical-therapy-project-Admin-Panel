<div class="modal-form-vertical d-flex flex-column gap-3">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.UI.PATIENT_USERNAME' | translate }} {{ mode === 'create' ? '*' : '' }}
        <input
          [id]="formId + '-userName'"
          name="userName"
          [class.is-invalid]="!!errorFor('userName')"
          [attr.aria-invalid]="errorFor('userName') ? true : null"
          [attr.aria-describedby]="errorFor('userName') ? formId + '-userName-error' : formId + '-userName-help'"
          class="form-control form-control-sm"
          type="text"
          [(ngModel)]="draft.userName"
          [ngModelOptions]="{standalone: true}"
          [required]="mode === 'create'"
          minlength="3"
          maxlength="50"
          dir="auto"
        />
        <small
          class="text-secondary d-block fw-normal"
          [id]="formId + '-userName-help'"
          >{{ (mode === 'create' ? 'RECEPTIONIST.UI.PATIENT_USERNAME_HINT' : 'RECEPTIONIST.UI.PATIENT_USERNAME_EDIT_HINT') | translate }}</small
        >
        @if (errorFor('userName'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-userName-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.UI.PATIENT_FULL_NAME' | translate }} *
        <input
          [id]="formId + '-nameEn'"
          name="nameEn"
          [class.is-invalid]="!!errorFor('nameEn')"
          [attr.aria-invalid]="errorFor('nameEn') ? true : null"
          [attr.aria-describedby]="errorFor('nameEn') ? formId + '-nameEn-error' : null"
          class="form-control form-control-sm"
          type="text"
          [(ngModel)]="draft.nameEn"
          [ngModelOptions]="{standalone: true}"
          required
          minlength="2"
          maxlength="150"
          dir="auto"
        />
        @if (errorFor('nameEn'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-nameEn-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
    @if (mode === 'edit') {
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.UI.PATIENT_EMAIL' | translate }}
        <input [id]="formId + '-email'" name="email" type="email" class="form-control form-control-sm"
          [(ngModel)]="draft.email" [ngModelOptions]="{standalone: true}" dir="ltr"
          [class.is-invalid]="!!errorFor('email')" [attr.aria-invalid]="errorFor('email') ? true : null"
          [attr.aria-describedby]="errorFor('email') ? formId + '-email-error' : null" />
        @if (errorFor('email'); as error) {
          <small class="text-danger d-block fw-normal" [id]="formId + '-email-error'">{{ ('RECEPTIONIST.UI.' + error) | translate }}</small>
        }
      </label>
    </div>
    }
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.PHONE' | translate }} *
        <input
          [id]="formId + '-phone'"
          name="phone"
          [class.is-invalid]="!!errorFor('phone')"
          [attr.aria-invalid]="errorFor('phone') ? true : null"
          [attr.aria-describedby]="errorFor('phone') ? formId + '-phone-error' : null"
          class="form-control form-control-sm"
          type="tel"
          [(ngModel)]="draft.phone"
          [ngModelOptions]="{standalone: true}"
          required
          maxlength="20"
          dir="ltr"
        />
        @if (errorFor('phone'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-phone-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.DOB' | translate }} *
        <input
          [id]="formId + '-dob'"
          name="dob"
          [class.is-invalid]="!!errorFor('dob')"
          [attr.aria-invalid]="errorFor('dob') ? true : null"
          [attr.aria-describedby]="errorFor('dob') ? formId + '-dob-error' : null"
          class="form-control form-control-sm"
          type="date"
          [(ngModel)]="draft.dob"
          [ngModelOptions]="{standalone: true}"
          required
        />
        @if (errorFor('dob'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-dob-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.GENDER_TH' | translate }} *
        <select
          [id]="formId + '-gender'"
          name="gender"
          [class.is-invalid]="!!errorFor('gender')"
          [attr.aria-invalid]="errorFor('gender') ? true : null"
          [attr.aria-describedby]="errorFor('gender') ? formId + '-gender-error' : null"
          class="form-select form-select-sm"
          [(ngModel)]="draft.gender"
          [ngModelOptions]="{standalone: true}"
        >
          <option value="Male">{{ 'RECEPTIONIST.MALE' | translate }}</option>
          <option value="Female">
            {{ 'RECEPTIONIST.FEMALE' | translate }}
          </option>
        </select>
        @if (errorFor('gender'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-gender-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.PAYMENT_TYPE' | translate }}
        <select
          [id]="formId + '-paymentType'"
          name="paymentType"
          class="form-select form-select-sm"
          [(ngModel)]="draft.paymentType"
          (ngModelChange)="paymentTypeChanged()"
          [ngModelOptions]="{standalone: true}"
        >
          <option [ngValue]="null">{{ 'RECEPTIONIST.UI.NOT_SET' | translate }}</option>
          @if (draft.paymentType && !paymentTypes.includes(draft.paymentType)) {
            <option [ngValue]="draft.paymentType">{{ draft.paymentType }}</option>
          }
          <option value="Cash">{{ 'RECEPTIONIST.CASH' | translate }}</option>
          <option value="Insurance">
            {{ 'RECEPTIONIST.INSURANCE_PAYMENT' | translate }}
          </option>
          <option value="Online">
            {{ 'RECEPTIONIST.UI.ONLINE' | translate }}
          </option>
          <option value="Card">{{ 'RECEPTIONIST.CARD' | translate }}</option>
          <option value="InstaPay">{{ 'RECEPTIONIST.INSTAPAY' | translate }}</option>
        </select>
      </label>
    </div>
    <div class="col-md-6">
      <label class="form-label fw-bold small w-100">
        {{ 'RECEPTIONIST.UI.PATIENT_EMERGENCY_CONTACT' | translate }}
        <input
          [id]="formId + '-emergencyContact'"
          name="emergencyContact"
          [class.is-invalid]="!!errorFor('emergencyContact')"
          [attr.aria-invalid]="errorFor('emergencyContact') ? true : null"
          [attr.aria-describedby]="errorFor('emergencyContact') ? formId + '-emergencyContact-error' : null"
          class="form-control form-control-sm"
          type="tel"
          [(ngModel)]="draft.emergencyContact"
          [ngModelOptions]="{standalone: true}"
          maxlength="20"
          dir="ltr"
        />
        @if (errorFor('emergencyContact'); as error) {
        <small
          class="text-danger d-block fw-normal"
          [id]="formId + '-emergencyContact-error'"
          >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
        >
        }
      </label>
    </div>
  </div>
  @if ((draft.paymentType === 'Insurance' || showInsuranceDetails) && draft.insuranceDetails; as details)
  {
  <div class="card card-bg border p-3 rounded">
    <div class="section-label fw-bold small mb-2">
      {{ 'RECEPTIONIST.INSURANCE_DETAILS' | translate }}
    </div>
    @if (insuranceError) {
    <p role="alert" class="text-danger">
      {{ 'RECEPTIONIST.UI.PATIENT_COMPANIES_FAILED' | translate }}
    </p>
    }
    <label class="form-label fw-bold small w-100">
      {{ 'RECEPTIONIST.INSURANCE_COMPANY' | translate }} {{ draft.paymentType === 'Insurance' ? '*' : '' }}
      <select
        [id]="formId + '-insuranceCompanyId'"
        name="insuranceCompanyId"
        [class.is-invalid]="!!errorFor('insuranceCompanyId')"
        [attr.aria-invalid]="errorFor('insuranceCompanyId') ? true : null"
        [attr.aria-describedby]="errorFor('insuranceCompanyId') ? formId + '-insuranceCompanyId-error' : null"
        class="form-select form-select-sm"
        [(ngModel)]="draft.insuranceCompanyId"
        [ngModelOptions]="{standalone: true}"
        [disabled]="insuranceLoading"
        [required]="draft.paymentType === 'Insurance'"
      >
        <option [ngValue]="null">
          {{ 'RECEPTIONIST.UI.PATIENT_SELECT_COMPANY' | translate }}
        </option>
        @for (company of companies; track company.id) {
        <option [ngValue]="company.id">{{ company.name }}</option>
        }
        @if (draft.insuranceCompanyId && !companiesHaveSelectedId()) {
          <option [ngValue]="draft.insuranceCompanyId">{{ draft.insuranceCompany || ('RECEPTIONIST.INSURANCE_COMPANY' | translate) }} (#{{ draft.insuranceCompanyId }})</option>
        }
      </select>
      @if (errorFor('insuranceCompanyId'); as error) {
      <small
        class="text-danger d-block fw-normal"
        [id]="formId + '-insuranceCompanyId-error'"
        >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
      >
      }
    </label>
    <div class="row g-3 mt-1">
      <div class="col-md-6">
        <label class="form-label fw-bold small w-100">
          {{ 'RECEPTIONIST.UI.PATIENT_INSURANCE_STATUS' | translate }}
          <input [id]="formId + '-apiStatus'" name="apiStatus" type="number" step="1" class="form-control form-control-sm"
            min="-2147483648" max="2147483647"
            [(ngModel)]="details.apiStatus" [ngModelOptions]="{standalone: true}"
            [class.is-invalid]="!!errorFor('apiStatus')" [attr.aria-invalid]="errorFor('apiStatus') ? true : null"
            [attr.aria-describedby]="errorFor('apiStatus') ? formId + '-apiStatus-error' : null" />
          @if (errorFor('apiStatus'); as error) {
            <small class="text-danger d-block fw-normal" [id]="formId + '-apiStatus-error'">{{ ('RECEPTIONIST.UI.' + error) | translate }}</small>
          }
        </label>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small w-100">
          {{ 'RECEPTIONIST.MEMBER_ID' | translate }}
          <input
            name="memberId"
            class="form-control form-control-sm"
            [(ngModel)]="details.memberId"
            [ngModelOptions]="{standalone: true}"
            dir="auto"
          />
        </label>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small w-100">
          {{ 'RECEPTIONIST.EMPLOYER' | translate }}
          <input
            name="employer"
            class="form-control form-control-sm"
            [(ngModel)]="details.employer"
            [ngModelOptions]="{standalone: true}"
            dir="auto"
          />
        </label>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small w-100">
          {{ 'RECEPTIONIST.COPAY_PERCENTAGE' | translate }} (%)
          <input
            [id]="formId + '-copayPercentage'"
            name="copayPercentage"
            [class.is-invalid]="!!errorFor('copayPercentage')"
            [attr.aria-invalid]="errorFor('copayPercentage') ? true : null"
            [attr.aria-describedby]="errorFor('copayPercentage') ? formId + '-copayPercentage-error' : null"
            class="form-control form-control-sm"
            type="number"
            min="0"
            max="100"
            step="any"
            [(ngModel)]="details.copayPercentage"
            [ngModelOptions]="{standalone: true}"
          />
          @if (errorFor('copayPercentage'); as error) {
          <small
            class="text-danger d-block fw-normal"
            [id]="formId + '-copayPercentage-error'"
            >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
          >
          }
        </label>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small w-100">
          {{ 'RECEPTIONIST.APPROVED_SESSIONS' | translate }}
          <input
            [id]="formId + '-approvedSessions'"
            name="approvedSessions"
            [class.is-invalid]="!!errorFor('approvedSessions')"
            [attr.aria-invalid]="errorFor('approvedSessions') ? true : null"
            [attr.aria-describedby]="errorFor('approvedSessions') ? formId + '-approvedSessions-error' : null"
            class="form-control form-control-sm"
            type="number"
            step="1"
            min="0"
            max="2147483647"
            [(ngModel)]="details.approvedSessions"
            [ngModelOptions]="{standalone: true}"
          />
          @if (errorFor('approvedSessions'); as error) {
          <small
            class="text-danger d-block fw-normal"
            [id]="formId + '-approvedSessions-error'"
            >{{ ('RECEPTIONIST.UI.' + error) | translate }}</small
          >
          }
        </label>
      </div>
    </div>
  </div>
  }
</div>
