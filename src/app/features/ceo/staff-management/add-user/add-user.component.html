<div>
  <h4 class="mb-4">Create New User</h4>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()" autocomplete="off">
    <div class="row g-3">
      
      <!-- Full Name -->
      <div class="col-md-6 form-group">
        <label class="form-label">Full Name</label>
        <input type="text" formControlName="fullName" class="form-control" [ngClass]="{'is-invalid': userForm.controls.fullName.invalid && userForm.controls.fullName.touched}">
        <div class="invalid-feedback">
          Full Name is required.
        </div>
      </div>

      <!-- Username -->
      <div class="col-md-6 form-group">
        <label class="form-label">Username</label>
        <input type="text" formControlName="userName" class="form-control" [ngClass]="{'is-invalid': userForm.controls.userName.invalid && userForm.controls.userName.touched}" autocomplete="new-password">
        <div class="invalid-feedback">
          Username is required.
        </div>
      </div>

      <!-- Password -->
      <div class="col-md-6 form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" class="form-control" [ngClass]="{'is-invalid': userForm.controls.password.invalid && userForm.controls.password.touched}" autocomplete="new-password">
          <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
          <div class="invalid-feedback">
            Valid password is required (min 6 characters).
          </div>
        </div>
      </div>

      <!-- Gender -->
      <div class="col-md-6 form-group">
        <label class="form-label">Gender</label>
        <select formControlName="gender" class="form-select" [ngClass]="{'is-invalid': userForm.controls.gender.invalid && userForm.controls.gender.touched}">
          <option value="0">Male</option>
          <option value="1">Female</option>
        </select>
        <div class="invalid-feedback">
          Gender is required.
        </div>
      </div>

      <!-- Birth Date -->
      <div class="col-md-6 form-group">
        <label class="form-label">Birth Date</label>
        <input type="date" formControlName="birthDate" class="form-control" [ngClass]="{'is-invalid': userForm.controls.birthDate.invalid && userForm.controls.birthDate.touched}">
        <div class="invalid-feedback">
          Birth Date is required.
        </div>
      </div>

      <!-- Role -->
      <div class="col-md-6 form-group">
        <label class="form-label">Role</label>
        <select formControlName="role" class="form-select" [ngClass]="{'is-invalid': userForm.controls.role.invalid && userForm.controls.role.touched}">
          <option value="" disabled selected>Select Role</option>
          <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
        </select>
        <div class="invalid-feedback">
          Role is required.
        </div>
      </div>

    </div>

    <div class="mt-4 text-end">
      <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">
        <i class="bi bi-check-circle me-2"></i> Save User
      </button>
    </div>
  </form>
</div>
