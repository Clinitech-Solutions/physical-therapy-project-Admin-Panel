<div class="topbar w-full">
  @if(clinic.identity();as identity){<span class="clinic-identity text-sm fw-bold text-truncate" style="max-width:32vw" [title]="identity.name">{{identity.name}}</span>}
  <!-- Mobile toggle -->
  <button appButton="secondary" actionAppearance="utility" actionSize="compact" type="button" class="btn btn-ghost btn-icon mobile-menu-toggle" (click)="menuToggle.emit()"
    aria-controls="main-navigation" [attr.aria-expanded]="menuOpen"
    [attr.aria-label]="('COMMON.TOGGLE_NAVIGATION' | translate) || 'Toggle navigation'">
    <i class="bi bi-list"></i>
  </button>

  <div class="ms-auto flex items-center gap-4">
    <!-- Language & Theme Toggles -->
    <app-language-selector></app-language-selector>
    <app-theme-toggle></app-theme-toggle>

    <!-- Notification Bell -->
    <button appButton="secondary" actionAppearance="utility" actionSize="compact" type="button" class="btn btn-ghost btn-icon" [attr.aria-label]="('COMMON.NOTIFICATIONS' | translate) || 'Notifications'">
      <i class="bi bi-bell"></i>
    </button>

    <!-- Avatar & Role -->
    <div class="flex items-center gap-3">
      <div class="flex-col items-end d-none d-md-flex">
        <span class="text-sm fw-bold">{{ authService.currentUser()?.userName || 'User' }}</span>
        <span class="badge badge-info">{{ getRoleKey(authService.currentRole()) | translate }}</span>
      </div>
      <div class="avatar avatar-sm">{{ (authService.currentUser()?.userName?.charAt(0) || 'U') | uppercase }}</div>
    </div>
  </div>
</div>
